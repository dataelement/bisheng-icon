name: Publish to npm

# v* tag 推上来时自动发布到 npm registry。
# 配合插件的"发布时直接打 tag"——Figma 一发布即自动到 npm。
#
# 前置：需要在仓库 Settings → Secrets and variables → Actions 里
# 添加 NPM_TOKEN（npmjs.com 生成的发布 token）。

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) 与 tag ($TAG_VERSION) 不一致，拒绝发布"
            exit 1
          fi
          echo "version $PKG_VERSION matches tag $GITHUB_REF_NAME"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
