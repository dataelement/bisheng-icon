name: Publish to npm

# v* tag 推上来时自动发布到 npm registry。
# 配合插件的"发布时直接打 tag"——Figma 一发布即自动到 npm。
#
# 前置：npmjs.com 的 bisheng-icons 包 Settings 里配置 Trusted Publisher
# （GitHub Actions / dataelement / bisheng-icon / npm-publish.yml），
# 通过 OIDC 免 token 发布，无需 NPM_TOKEN secret。

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) 与 tag ($TAG_VERSION) 不一致，拒绝发布"
            exit 1
          fi
          echo "version $PKG_VERSION matches tag $GITHUB_REF_NAME"

      - name: Check if version already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "bisheng-icons@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::bisheng-icons@$PKG_VERSION 已在 npm 上（可能已手动发布），跳过重复发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update npm for OIDC trusted publishing
        if: steps.check.outputs.exists == 'false'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --access public
